
name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android ZIP
        run: |
          mkdir -p android-project
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Android ZIP file not found!"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d android-project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build Debug APK
        run: |
          WRAPPER=$(find android-project -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
